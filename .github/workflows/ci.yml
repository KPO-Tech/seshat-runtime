name: CI

on:
  push:
    branches: ["main", "dev"]
  # No base filter: a PR whose base is another topic branch is how a multi-step
  # change is reviewed here, and with `branches: [main, dev]` those PRs ran no
  # check at all — they were merged on the strength of the layer below them. A
  # run is kicked off by the PR itself, so the cost is one full suite per open
  # PR and per push to its head, not per branch in the repository. Keep the
  # number of layers to what the review actually needs.
  #
  # Two limits remain, both deliberate:
  #   - Retargeting a PR does not re-run this workflow: that is an `edited`
  #     event, and triggering on `edited` would let a title edit produce a Gate
  #     that certified nothing. The outcome is a blocked merge — GitHub waits
  #     for a check that never reports — so after changing the base, push a
  #     commit or run `gh workflow run ci.yml --ref <branch>`.
  #   - A push to a lower layer does not re-run the PRs stacked on it, because
  #     their head has not moved. Each PR therefore keeps the result of its own
  #     head SHA, and the review of the top layer has to account for it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        run: go build ./tui/cmd/cli/...

      - name: Build gRPC server
        run: go build ./cmd/grpc/...

      - name: Build all packages
        run: go build ./... ./tui/...

  test:
    name: Test
    runs-on: ubuntu-latest
    # The pgvector store tests need a real database (they skip without one).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: seshat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SESHAT_TEST_POSTGRES_DSN: postgres://postgres:test@localhost:5432/seshat?sslmode=disable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests with race detector
        run: go test -race ./... ./tui/... -timeout 300s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Unformatted files:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./... ./tui/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m

      # The terminal interface is a module of its own (tui/): golangci-lint lints one module at a time.
      - name: golangci-lint (tui)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          install-mode: goinstall
          working-directory: tui
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        # Blocks on a new finding of high severity (medium confidence or better). The 75 high-severity findings of the first scan
        # were triaged: 10 were fixed or accepted one by one with a "#nosec <rule> -- reason" on the line; four classes were judged
        # false positives for this code base and are excluded here, with the reason:
        #   G101  hard-coded credentials: constants that are the NAME of an environment variable or an OAuth endpoint URL;
        #   G404  weak random numbers: retry jitter, animations, load spreading, level draws of the HNSW graph, message ids;
        #   G115  integer conversions: sizes and ids that are bounded where they are made (checked at the three places that read
        #         them from a file or from the network);
        #   G704  SSRF by taint: the URLs are the ones the user configured (providers, Ollama, document reader); the fetch tool
        #         that takes a URL from the model has its own policy (internal/web/net_policy.go).
        # The 400-odd findings of medium and low severity are not gated: they are mostly file permissions and variable paths.
        # Built with the Go of the job (go.mod's), not run from the gosec Docker action: that image carries its own Go (1.26.5 when
        # this was written) and cannot load a module that asks for 1.26.6, so it analysed nothing ("Issues: 0", with a "Golang
        # errors" list), and the report-only mode hid it. A failure to load packages fails this step now.
        # Pinned: a tool that moves under the build is a way into the build.
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -severity high -confidence medium -exclude=G101,G404,G115,G704 -exclude-generated ./...

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    steps:
      # Only the bases below are policed. A PR stacked on a topic branch has no
      # base to police: what it will merge into is the layer underneath it, and
      # that layer is the one that has to target dev.
      - name: Enforce PR branch flow
        # The refs reach the script through the environment, never through
        # `${{ }}` inside it: a branch name is chosen by whoever opens the pull
        # request, and interpolating one into a shell line is how a script
        # injection is built. Handed over through `env:` and quoted below, the
        # same values are inert.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && \
                "$BASE_REF" == "main" && \
                "$HEAD_REF" != "dev" ]]; then
            echo "Pull requests targeting main must come from dev."
            echo "Current head branch: $HEAD_REF"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" && \
                "$BASE_REF" == "dev" ]]; then
            case "$HEAD_REF" in
              feat/*|feature/*|fix/*|bugfix/*|docs/*|refactor/*|test/*|chore/*|perf/*|ci/*|dependabot/*)
                ;;
              *)
                echo "Pull requests targeting dev must come from a typed topic branch."
                echo "Allowed prefixes: feat/, feature/, fix/, bugfix/, docs/, refactor/, test/, chore/, perf/, ci/, dependabot/"
                echo "Current head branch: $HEAD_REF"
                exit 1
                ;;
            esac
          fi

          echo "Branch policy check passed."

  # gate is the single required status check for branch protection.
  # Adding new jobs above automatically blocks the merge without
  # touching the branch protection rules again.
  gate:
    name: Gate
    runs-on: ubuntu-latest
    needs: [build, test, lint, security, branch-policy]
    if: always()
    steps:
      - name: All checks passed
        run: |
          if [[ "${{ needs.build.result }}" != "success" || \
                "${{ needs.test.result }}"  != "success" || \
                "${{ needs.lint.result }}"  != "success" || \
                "${{ needs.security.result }}" != "success" || \
                "${{ needs.branch-policy.result }}" != "success" ]]; then
            echo "One or more required checks failed."
            echo "  build: ${{ needs.build.result }}"
            echo "  test:  ${{ needs.test.result }}"
            echo "  lint:  ${{ needs.lint.result }}"
            echo "  security: ${{ needs.security.result }}"
            echo "  branch-policy: ${{ needs.branch-policy.result }}"
            exit 1
          fi
          echo "All checks passed."
