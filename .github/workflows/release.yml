name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  validate-release-ref:
    name: Validate release ref
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tag to be on main
        run: |
          git fetch origin main --tags
          TAG_SHA="${{ github.sha }}"
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "Release tags must point to a commit already reachable from origin/main."
            echo "Tag commit: $TAG_SHA"
            echo "origin/main: $(git rev-parse origin/main)"
            exit 1
          fi

  build:
    name: Build ${{ matrix.suffix }}
    needs: validate-release-ref
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: darwin-amd64
          - goos: darwin
            goarch: arm64
            suffix: darwin-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: ".exe"
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.event.inputs.tag || github.ref_name }}" \
            -o dist/seshat-${{ matrix.suffix }}${{ matrix.ext }} \
            ./tui/cmd/cli

      - name: Build gRPC server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.event.inputs.tag || github.ref_name }}" \
            -o dist/seshat-grpc-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/grpc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # The only job that writes: it creates the release. The others only read the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: binaries-*
          path: dist/
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
