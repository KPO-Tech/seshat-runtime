[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat-sdk"
version = "0.1.0"
description = "Python client for the Seshat agent runtime: sessions, streaming turns, approvals, tools, skills, MCP, memory and workflows over gRPC."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "KPO-Tech" }]
keywords = ["ai", "agent", "runtime", "grpc", "seshat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # The stubs are generated by grpcio-tools 1.85.1 and protoc 7.35.1, and both
    # check their runtime when they are imported: an older pair does not import,
    # it fails. These floors are those checks, written down.
    "grpcio>=1.85",
    "protobuf>=7.35",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://seshat-ai.com"
Documentation = "https://seshat-ai.com/en/docs/sdk/grpc-api"
Source = "https://github.com/KPO-Tech/seshat-runtime"

[tool.setuptools.packages.find]
include = ["seshat*"]

[tool.setuptools.package-data]
seshat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
# protoc's output, not ours: `make proto` writes it and it is not written to be
# linted.
extend-exclude = ["seshat/_proto"]

[tool.ruff.lint]
# What catches a mistake rather than a taste: an undefined name, an unused
# import, an import order that turns into a cycle, a mutable default, a
# comparison that is always true. The modernization family (UP) is deliberately
# off: the package writes its annotations in one style (`Optional[...]`,
# `Dict[...]`) on purpose, and those rules would rewrite the whole surface for no
# behavioural gain.
select = ["E9", "F", "I", "B"]
