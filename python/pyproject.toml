[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat-sdk"
version = "0.1.0"
description = "Python client for the Seshat agent runtime: sessions, streaming turns, approvals, tools, skills, MCP, memory and workflows over gRPC."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "KPO-Tech" }]
keywords = ["ai", "agent", "runtime", "grpc", "seshat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://seshat-ai.com"
Documentation = "https://seshat-ai.com/en/docs/sdk/grpc-api"
Source = "https://github.com/KPO-Tech/seshat-runtime"

[tool.setuptools.packages.find]
include = ["seshat*"]

[tool.setuptools.package-data]
seshat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
