[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seshat-sdk"
version = "0.1.0"
description = "Python client for the Seshat agent runtime: sessions, streaming turns, approvals, tools, skills, MCP, memory and workflows over gRPC."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "KPO-Tech" }]
keywords = ["ai", "agent", "runtime", "grpc", "seshat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://seshat-ai.com"
Documentation = "https://seshat-ai.com/en/docs/sdk/grpc-api"
Source = "https://github.com/KPO-Tech/seshat-runtime"

[tool.setuptools.packages.find]
include = ["seshat*"]

[tool.setuptools.package-data]
seshat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
# protoc's output, not ours: `make proto` writes it and it is not written to be
# linted.
extend-exclude = ["seshat/_proto"]

[tool.ruff.lint]
# What catches a mistake rather than a taste: an undefined name, an unused
# import, an import order that turns into a cycle, a mutable default, a
# comparison that is always true. The modernization family (UP) is deliberately
# off: the package supports Python 3.9, and those rules would rewrite the
# annotations it keeps deliberately.
select = ["E9", "F", "I", "B"]
