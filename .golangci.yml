run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - staticcheck
    - gosimple
    - ineffassign
    - errcheck
    - gofmt
    - misspell
    # AGENTS.md: no //nolint without an explanation on the same line, and none that no longer suppresses anything.
    - nolintlint
    # An HTTP request must carry the context of its caller, so that cancelling the call cancels the request.
    - noctx
    # The body of an HTTP response is closed, so that the connection goes back to the pool.
    - bodyclose
    # An error is compared with errors.Is and read with errors.As, and wrapped with %w: a wrapped error must still be recognised.
    - errorlint

linters-settings:
  nolintlint:
    require-explanation: true
    require-specific: true
    allow-unused: false
  errcheck:
    # Intentional fire-and-forget calls throughout the codebase.
    exclude-functions:
      - fmt.Fprintf
      - fmt.Fprintln
      - fmt.Printf
      - fmt.Println
      - (io.Writer).Write
      - (*os.File).Close
      - os.Remove
      - os.RemoveAll

issues:
  # Code kept from github.com/ledongthuc/pdf (see NOTICE): its style is its own.
  exclude-dirs:
    - internal/pdfread
  max-issues-per-linter: 0
  max-same-issues: 0

  exclude-rules:
    # errcheck: known intentional fire-and-forget patterns
    - linters: [errcheck]
      text: "json.Unmarshal"
    - linters: [errcheck]
      text: "os.MkdirAll"
    - linters: [errcheck]
      text: "os.Chdir"
    - linters: [errcheck]
      text: "fmt.Sscanf"
    - linters: [errcheck]
      text: "Disconnect"
    - linters: [errcheck]
      text: '\.Stop'
    - linters: [errcheck]
      text: '\.Notify'
    - linters: [errcheck]
      text: "BindEnv"
    - linters: [errcheck]
      text: "loadEnvFile"
    - linters: [errcheck]
      text: "learnProjectPatternToStore"
    - linters: [errcheck]
      text: "SetText|SetBold|SetItalic|SetUnderline|SetColor|SetSize|AddRun"

    # errcheck: test helpers and HTTP handlers in tests
    - linters: [errcheck]
      path: '_test\.go'
    - linters: [ineffassign]
      path: '_test\.go'
    - linters: [staticcheck]
      path: '_test\.go'
      text: "SA4006"

    # errcheck: w.Write in HTTP handlers — standard pattern, errors are network-level
    - linters: [errcheck]
      text: 'w\.Write'

    # staticcheck: deprecated gRPC DialContext — migrating separately
    - linters: [staticcheck]
      text: "SA1019.*grpc.DialContext"

    # staticcheck: mcp.LoggingLevel is deprecated per SEP-2577 but remains functional
    # for at least twelve months and has no replacement API yet. Written here rather
    # than as a //nolint because the staticcheck bundled with golangci-lint v1, built
    # with Go 1.26, no longer reads the dependency's Deprecated marker: the directive
    # suppressed nothing on the lint runner and nolintlint failed the build instead.
    - linters: [staticcheck]
      text: "SA1019.*LoggingLevel"

    # staticcheck: string context keys and nil context in tests — cosmetic
    - linters: [staticcheck]
      path: '_test\.go'
      text: "SA1029|SA1012"

    # staticcheck: empty branch in test — intentional placeholder
    - linters: [staticcheck]
      path: '_test\.go'
      text: "SA9003"
